<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ========================= -->
    <!-- Basic Meta -->
    <!-- ========================= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ========================= -->
    <!-- Website Title -->
    <!-- ========================= -->
    <title>
        {% block title %}
        ChemLab
        {% endblock %}
    </title>

    <!-- ========================= -->
    <!-- Favicon -->
    <!-- ========================= -->
    <link rel="icon" href="{{ url_for('static', filename='images/logo.png') }}">

    <!-- ========================= -->
    <!-- Google Font -->
    <!-- ========================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ========================= -->
    <!-- Main CSS -->
    <!-- ========================= -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- ========================= -->
    <!-- Font Awesome -->
    <!-- ========================= -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <!-- ========================= -->
    <!-- Navbar -->
    <!-- ========================= -->
    <nav>
        <div class="logo">
            <i class="fa-solid fa-atom"></i>
            <span>ChemLab</span>
        </div>

        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('periodic') }}">Periodic</a></li>
            <li><a href="{{ url_for('mol') }}">Mol Calc</a></li>
            <li><a href="{{ url_for('equation') }}">Equation</a></li>
            <li><a href="{{ url_for('compound') }}">Compound</a></li>
            <li><a href="{{ url_for('quiz') }}">Quiz</a></li>
        </ul>
    </nav>

    <!-- ========================= -->
    <!-- Nút Đổi Giao Diện + Dịch: Góc Trên Phải Luôn Thấy -->
    <!-- ========================= -->
    <div style="position: fixed; top: 12px; right: 20px; z-index: 9999; display: flex; gap: 12px; align-items: center;">
        <button id="theme-toggle" style="background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.25s;">
            <i class="fa-solid fa-moon"></i>
        </button>
        <div id="google_translate_element"></div>
    </div>

    <!-- ========================= -->
    <!-- Main Content -->
    <!-- ========================= -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->
    <footer>
        <h2>
            <i class="fa-solid fa-flask"></i>
            ChemLab
        </h2>
        <p>Learn Chemistry Smarter.</p>
        <p>Made with by Trần Việt Anh</p>
        <p>© 2026 ChemLab</p>
    </footer>

    <!-- ========================= -->
    <!-- JavaScript -->
    <!-- ========================= -->
    <script src="{{ url_for('static', filename='js/home.js') }}"></script>

    <!-- Dark Mode Toggle -->
    <script>
        const toggle = document.getElementById('theme-toggle');
        const icon = toggle.querySelector('i');
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function setTheme(isDark) {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        setTheme(saved === 'dark' || (!saved && prefersDark));

        toggle.addEventListener('click', () => {
            const now = document.documentElement.getAttribute('data-theme') === 'dark';
            setTheme(!now);
        });
    </script>

    <!-- Google Translate -->
    <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'vi,en',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
