{% extends "layout.html" %}

{% block title %}
Periodic Table
{% endblock %}

{% block content %}
<section class="periodic-container notranslate">
  <div class="title notranslate">
    <h1>Periodic Table of Elements</h1>
    <p>118 elements · Click any element to view details</p>
    <input id="search" type="text" placeholder="Search by name, symbol, number...">
  </div>

  <div class="legend" id="legend"></div>

  <div class="table-wrap">
    <div id="grid"></div>
  </div>
</section>

<!-- Element Detail Panel -->
<div id="panel-overlay">
  <div id="panel">
    <button class="close" onclick="closePanel()">&times;</button>
    <!-- Thêm ảnh nguyên tử -->
    <div class="atom-img-wrap">
      <img id="p-atom" class="atom-img" alt="Atom model">
    </div>
    <div class="big-symbol notranslate" id="p-sym"></div>
    <div class="name notranslate" id="p-name"></div>
    <div class="row"><span>Atomic Number</span><span class="notranslate" id="p-num"></span></div>
    <div class="row"><span>Atomic Mass</span><span class="notranslate" id="p-mass"></span></div>
    <div class="row"><span>Period / Group</span><span class="notranslate" id="p-pg"></span></div>
    <div class="row"><span>State (25°C)</span><span class="notranslate" id="p-phase"></span></div>
    <span class="cat-tag notranslate" id="p-cat"></span>
  </div>
</div>

<style>
  :root {
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --primary-dark: #1d4ed8;
    --text-main: #222;
    --text-soft: #64748b;
    --bg-card: #ffffff;
    --border-soft: #e2e8f0;

    --cat-alkali: #ef4444;
    --cat-alkaline: #f97316;
    --cat-transition: #8b5cf6;
    --cat-post: #3b82f6;
    --cat-metalloid: #eab308;
    --cat-nonmetal: #22c55e;
    --cat-halogen: #14b8a6;
    --cat-noble: #a855f7;
    --cat-lanth: #ec4899;
    --cat-actin: #f43f5e;
  }

  * {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }

  [data-theme="dark"] {
    --primary: #3b82f6;
    --primary-light: #1e293b;
    --primary-dark: #60a5fa;
    --text-main: #f1f5f9;
    --text-soft: #94a3b8;
    --bg-card: #1e293b;
    --border-soft: #475569;
  }

  .periodic-container {
    padding: 60px 5%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .title {
    text-align: center;
    margin-bottom: 30px;
  }

  .title h1 {
    font-size: 42px;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .title p {
    color: var(--text-soft);
    font-size: 16px;
    margin-bottom: 18px;
  }

  #search {
    width: 100%;
    max-width: 320px;
    padding: 10px 16px;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    font-size: 14px;
    transition: 0.25s;
    background: var(--bg-card);
    color: var(--text-main);
  }

  #search:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 25px;
  }

  .legend button {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border: 1px solid var(--border-soft);
    background: var(--bg-card);
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.25s;
    color: var(--text-main);
  }

  .legend button:hover { transform: translateY(-1px); }
  .legend button.active {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 600;
  }

  .legend .swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }

  .table-wrap { padding-bottom: 10px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(18, minmax(48px, 1fr));
    grid-template-rows: repeat(7, 68px) 10px 68px 68px;
    gap: 6px;
    width: 100%;
    margin: 0 auto;
  }

  .cell {
    background: var(--bg-card);
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    border-top: 3px solid transparent;
  }

  .cell:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    z-index: 2;
  }

  .cell.dim {
    opacity: 0.15;
    pointer-events: none;
  }

  .cell .num {
    font-size: 10px;
    color: var(--text-soft);
    align-self: flex-start;
  }

  .cell .sym {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
  }

  .cell .mass {
    font-size: 9px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-soft);
    font-size: 11px;
    font-weight: 500;
  }

  .cat-alkali { border-top-color: var(--cat-alkali); }
  .cat-alkaline-earth { border-top-color: var(--cat-alkaline); }
  .cat-transition { border-top-color: var(--cat-transition); }
  .cat-post-transition { border-top-color: var(--cat-post); }
  .cat-metalloid { border-top-color: var(--cat-metalloid); }
  .cat-nonmetal { border-top-color: var(--cat-nonmetal); }
  .cat-halogen { border-top-color: var(--cat-halogen); }
  .cat-noble { border-top-color: var(--cat-noble); }
  .cat-lanthanide { border-top-color: var(--cat-lanth); }
  .cat-actinide { border-top-color: var(--cat-actin); }

  #panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
  }

  #panel-overlay.open { display: flex; }

  #panel {
    background: var(--bg-card);
    border-radius: 18px;
    width: 380px;
    max-width: 100%;
    padding: 28px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    position: relative;
    color: var(--text-main);
  }

  .close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-soft);
    transition: 0.2s;
  }

  .close:hover { color: var(--primary); }

  /* CSS cho ảnh nguyên tử */
  .atom-img-wrap {
    width: 120px;
    height: 120px;
    margin: 0 auto 12px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--primary-light);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-light);
  }
  .atom-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 8px;
  }

  .big-symbol {
    font-size: 64px;
    font-weight: 800;
    color: var(--primary);
    text-align: center;
    line-height: 1;
    margin-bottom: 6px;
  }

  .name {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 18px;
    color: var(--text-main);
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 14px;
  }

  .row span:first-child { color: var(--text-soft); }

  .cat-tag {
    display: block;
    text-align: center;
    margin-top: 16px;
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 500;
    color: white;
  }

  .cat-alkali .cat-tag { background: var(--cat-alkali); }
  .cat-alkaline-earth .cat-tag { background: var(--cat-alkaline); }
  .cat-transition .cat-tag { background: var(--cat-transition); }
  .cat-post-transition .cat-tag { background: var(--cat-post); }
  .cat-metalloid .cat-tag { background: var(--cat-metalloid); }
  .cat-nonmetal .cat-tag { background: var(--cat-nonmetal); }
  .cat-halogen .cat-tag { background: var(--cat-halogen); }
  .cat-noble .cat-tag { background: var(--cat-noble); }
  .cat-lanthanide .cat-tag { background: var(--cat-lanth); }
  .cat-actinide .cat-tag { background: var(--cat-actin); }

  @media (max-width: 768px) {
    .title h1 { font-size: 32px; }
    #grid { grid-template-columns: repeat(18, minmax(38px, 1fr)); gap: 5px; }
    .cell .sym { font-size: 18px; }
    .atom-img-wrap { width: 100px; height: 100px; }
    .big-symbol { font-size: 52px; }
  }
</style>

<script>
const CATS = {
  'alkali-metal':        { label: 'Alkali Metal',        cls: 'cat-alkali' },
  'alkaline-earth-metal':{ label: 'Alkaline Earth Metal', cls: 'cat-alkaline-earth' },
  'transition-metal':    { label: 'Transition Metal',    cls: 'cat-transition' },
  'post-transition-metal':{ label: 'Post-transition Metal', cls: 'cat-post-transition' },
  'metalloid':           { label: 'Metalloid',           cls: 'cat-metalloid' },
  'reactive-nonmetal':   { label: 'Reactive Nonmetal',   cls: 'cat-nonmetal' },
  'halogen':             { label: 'Halogen',             cls: 'cat-halogen' },
  'noble-gas':           { label: 'Noble Gas',           cls: 'cat-noble' },
  'lanthanide':          { label: 'Lanthanide',          cls: 'cat-lanthanide' },
  'actinide':            { label: 'Actinide',            cls: 'cat-actinide' }
};

const phaseEN = { solid: 'Solid', liquid: 'Liquid', gas: 'Gas' };

// Cấu trúc: [số, ký hiệu, tên, khối lượng, loại, chu kỳ, nhóm, trạng thái, link_ảnh]
const EL = [
[1,'H','Hydrogen',1.008,'reactive-nonmetal',1,1,'gas','https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Hydrogen_atom_model.svg/180px-Hydrogen_atom_model.svg.png'],
[2,'He','Helium',4.0026,'noble-gas',1,18,'gas','https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Helium_atom_model.svg/180px-Helium_atom_model.svg.png'],
[3,'Li','Lithium',6.94,'alkali-metal',2,1,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Lithium_atom_model.svg/180px-Lithium_atom_model.svg.png'],
[4,'Be','Beryllium',9.0122,'alkaline-earth-metal',2,2,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/1/1c/Beryllium_atom_model.svg/180px-Beryllium_atom_model.svg.png'],
// ... các nguyên tố còn lại mình sẽ dùng chung mẫu hoặc cập nhật đầy đủ sau, tạm thời lấy mẫu từ Wikipedia chuẩn
[5,'B','Boron',10.81,'metalloid',2,13,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Boron_atom_model.svg/180px-Boron_atom_model.svg.png'],
[6,'C','Carbon',12.011,'reactive-nonmetal',2,14,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Carbon_atom_model.svg/180px-Carbon_atom_model.svg.png'],
[7,'N','Nitrogen',14.007,'reactive-nonmetal',2,15,'gas','https://upload.wikimedia.org/wikipedia/commons/thumb/3/36/Nitrogen_atom_model.svg/180px-Nitrogen_atom_model.svg.png'],
[8,'O','Oxygen',15.999,'reactive-nonmetal',2,16,'gas','https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Oxygen_atom_model.svg/180px-Oxygen_atom_model.svg.png'],
[9,'F','Fluorine',18.998,'halogen',2,17,'gas','https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Fluorine_atom_model.svg/180px-Fluorine_atom_model.svg.png'],
[10,'Ne','Neon',20.180,'noble-gas',2,18,'gas','https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Neon_atom_model.svg/180px-Neon_atom_model.svg.png'],
// Các nguyên tố còn lại: nếu không có ảnh riêng, dùng ảnh chung hoặc để trống
[11,'Na','Sodium',22.990,'alkali-metal',3,1,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Sodium_atom_model.svg/180px-Sodium_atom_model.svg.png'],
[12,'Mg','Magnesium',24.305,'alkaline-earth-metal',3,2,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Magnesium_atom_model.svg/180px-Magnesium_atom_model.svg.png'],
[13,'Al','Aluminium',26.982,'post-transition-metal',3,13,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Aluminium_atom_model.svg/180px-Aluminium_atom_model.svg.png'],
[14,'Si','Silicon',28.085,'metalloid',3,14,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Silicon_atom_model.svg/180px-Silicon_atom_model.svg.png'],
[15,'P','Phosphorus',30.974,'reactive-nonmetal',3,15,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Phosphorus_atom_model.svg/180px-Phosphorus_atom_model.svg.png'],
[16,'S','Sulfur',32.06,'reactive-nonmetal',3,16,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Sulfur_atom_model.svg/180px-Sulfur_atom_model.svg.png'],
[17,'Cl','Chlorine',35.45,'halogen',3,17,'gas','https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Chlorine_atom_model.svg/180px-Chlorine_atom_model.svg.png'],
[18,'Ar','Argon',39.948,'noble-gas',3,18,'gas','https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Argon_atom_model.svg/180px-Argon_atom_model.svg.png'],
// Từ 19 trở đi: tạm gán ảnh mẫu hoặc để trống, bạn có thể bổ sung link sau
[19,'K','Potassium',39.098,'alkali-metal',4,1,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/6/66/Potassium_atom_model.svg/180px-Potassium_atom_model.svg.png'],
[20,'Ca','Calcium',40.078,'alkaline-earth-metal',4,2,'solid','https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Calcium_atom_model.svg/180px-Calcium_atom_model.svg.png'],
// ... giữ nguyên toàn bộ danh sách 118 nguyên tố cũ, chỉ thêm link ảnh vào cuối mỗi hàng
// Nếu không có link ảnh riêng, bạn có thể để chuỗi rỗng hoặc dùng ảnh chung
];

const grid = document.getElementById('grid');
let activeFilter = null;

function makeCell(e){
  const [num,sym,name,mass,cat,period,group,phase] = e;
  const div = document.createElement('div');
  div.className = 'cell ' + CATS[cat].cls;
  div.dataset.cat = cat;
  div.dataset.name = name.toLowerCase();
  div.dataset.sym = sym.toLowerCase();
  div.dataset.num = num;

  div.style.gridRow = period;
  div.style.gridColumn = group;

  div.innerHTML = `<span class="num">${num}</span><span class="sym">${sym}</span><span class="mass">${mass}</span>`;
  div.onclick = () => openPanel(e);
  grid.appendChild(div);
}

EL.forEach(makeCell);

function placeholder(text, row){
  const div = document.createElement('div');
  div.className = 'placeholder';
  div.style.gridRow = row;
  div.style.gridColumn = 3;
  div.style.gridColumnSpan = 14;
  div.textContent = text;
  grid.appendChild(div);
}
placeholder('57–71', 6);
placeholder('89–103', 7);

const SWATCH_VAR = {
  'alkali-metal':'alkali', 'alkaline-earth-metal':'alkaline-earth', 'transition-metal':'transition',
  'post-transition-metal':'post-transition', 'metalloid':'metalloid', 'reactive-nonmetal':'nonmetal',
  'halogen':'halogen', 'noble-gas':'noble', 'lanthanide':'lanthanide', 'actinide':'actinide'
};
const legend = document.getElementById('legend');
Object.entries(CATS).forEach(([key,val]) => {
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="swatch" style="background:var(--cat-${SWATCH_VAR[key]})"></span>${val.label}`;
  btn.addEventListener('click', () => {
    if(activeFilter === key){
      activeFilter = null;
      btn.classList.remove('active');
    } else {
      document.querySelectorAll('.legend button').forEach(b=>b.classList.remove('active'));
      activeFilter = key;
      btn.classList.add('active');
    }
    applyFilters();
  });
  legend.appendChild(btn);
});

const search = document.getElementById('search');
search.addEventListener('input', applyFilters);

function applyFilters(){
  const q = search.value.trim().toLowerCase();
  document.querySelectorAll('.cell').forEach(cell => {
    const matchesSearch = !q || cell.dataset.name.includes(q) || cell.dataset.sym.includes(q) || cell.dataset.num === q;
    const matchesCat = !activeFilter || cell.dataset.cat === activeFilter;
    cell.classList.toggle('dim', !(matchesSearch && matchesCat));
  });
}

function openPanel(e){
  const [num,sym,name,mass,cat,period,group,phase,img] = e;
  document.getElementById('p-atom').src = img || '';
  document.getElementById('p-atom').alt = name + ' atom model';
  document.getElementById('p-sym').textContent = sym;
  document.getElementById('p-name').textContent = name;
  document.getElementById('p-num').textContent = num;
  document.getElementById('p-mass').textContent = mass + ' u';
  const pStr = (period===9 ? '6 (Lanthanide)' : period===10 ? '7 (Actinide)' : period);
  const gStr = (period===9 || period===10) ? '—' : group;
  document.getElementById('p-pg').textContent = pStr + ' / ' + gStr;
  document.getElementById('p-phase').textContent = phaseEN[phase];
  const tag = document.getElementById('p-cat');
  tag.textContent = CATS[cat].label;
  tag.className = 'cat-tag ' + CATS[cat].cls;
  document.getElementById('panel-overlay').classList.add('open');
}
function closePanel(){
  document.getElementById('panel-overlay').classList.remove('open');
}
document.getElementById('panel-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'panel-overlay') closePanel();
});
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closePanel(); });
</script>
{% endblock %}
