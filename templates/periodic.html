{% extends "layout.html" %}

{% block title %}
Periodic Table
{% endblock %}

{% block content %}
<section class="periodic-container">
  <div class="title">
    <h1>Periodic Table of Elements</h1>
    <p>118 elements · Click any element to view details</p>
    <input id="search" type="text" placeholder="Search by name, symbol, number...">
  </div>

  <div class="legend" id="legend"></div>

  <div class="table-wrap">
    <div id="grid"></div>
  </div>
</section>

<!-- Element Detail Panel -->
<div id="panel-overlay">
  <div id="panel">
    <button class="close" onclick="closePanel()">&times;</button>
    <div class="big-symbol" id="p-sym"></div>
    <div class="name" id="p-name"></div>
    <div class="row"><span>Atomic Number</span><span id="p-num"></span></div>
    <div class="row"><span>Atomic Mass</span><span id="p-mass"></span></div>
    <div class="row"><span>Period / Group</span><span id="p-pg"></span></div>
    <div class="row"><span>State (25°C)</span><span id="p-phase"></span></div>
    <span class="cat-tag" id="p-cat"></span>
  </div>
</div>

<style>
  :root {
    --primary: #2563eb;
    --primary-light: #dbeafe;
    --primary-dark: #1d4ed8;
    --text-main: #222;
    --text-soft: #64748b;
    --bg-card: #ffffff;
    --border-soft: #e2e8f0;

    --cat-alkali: #ef4444;
    --cat-alkaline: #f97316;
    --cat-transition: #8b5cf6;
    --cat-post: #3b82f6;
    --cat-metalloid: #eab308;
    --cat-nonmetal: #22c55e;
    --cat-halogen: #14b8a6;
    --cat-noble: #a855f7;
    --cat-lanth: #ec4899;
    --cat-actin: #f43f5e;
  }

  * {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  .periodic-container {
    padding: 60px 5%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .title {
    text-align: center;
    margin-bottom: 30px;
  }

  .title h1 {
    font-size: 42px;
    color: var(--primary);
    margin-bottom: 8px;
  }

  .title p {
    color: var(--text-soft);
    font-size: 16px;
    margin-bottom: 18px;
  }

  #search {
    width: 100%;
    max-width: 320px;
    padding: 10px 16px;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    font-size: 14px;
    transition: 0.25s;
  }

  #search:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 25px;
  }

  .legend button {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border: 1px solid var(--border-soft);
    background: var(--bg-card);
    border-radius: 16px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.25s;
  }

  .legend button:hover { transform: translateY(-1px); }
  .legend button.active {
    border-color: var(--primary);
    background: var(--primary-light);
    color: var(--primary-dark);
    font-weight: 600;
  }

  .legend .swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: inline-block;
  }

  .table-wrap { padding-bottom: 10px; }

  #grid {
    display: grid;
    grid-template-columns: repeat(18, minmax(48px, 1fr));
    grid-template-rows: repeat(7, 68px) 10px 68px 68px;
    gap: 6px;
    width: 100%;
    margin: 0 auto;
  }

  .cell {
    background: var(--bg-card);
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 3px 8px rgba(0,0,0,0.06);
    border-top: 3px solid transparent;
  }

  .cell:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    z-index: 2;
  }

  .cell.dim {
    opacity: 0.15;
    pointer-events: none;
  }

  .cell .num {
    font-size: 10px;
    color: var(--text-soft);
    align-self: flex-start;
  }

  .cell .sym {
    font-size: 22px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1;
  }

  .cell .mass {
    font-size: 9px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-soft);
    font-size: 11px;
    font-weight: 500;
  }

  .cat-alkali { border-top-color: var(--cat-alkali); }
  .cat-alkaline-earth { border-top-color: var(--cat-alkaline); }
  .cat-transition { border-top-color: var(--cat-transition); }
  .cat-post-transition { border-top-color: var(--cat-post); }
  .cat-metalloid { border-top-color: var(--cat-metalloid); }
  .cat-nonmetal { border-top-color: var(--cat-nonmetal); }
  .cat-halogen { border-top-color: var(--cat-halogen); }
  .cat-noble { border-top-color: var(--cat-noble); }
  .cat-lanthanide { border-top-color: var(--cat-lanth); }
  .cat-actinide { border-top-color: var(--cat-actin); }

  #panel-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
  }

  #panel-overlay.open { display: flex; }

  #panel {
    background: var(--bg-card);
    border-radius: 18px;
    width: 360px;
    max-width: 100%;
    padding: 28px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    position: relative;
  }

  .close {
    position: absolute;
    top: 12px;
    right: 12px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--text-soft);
    transition: 0.2s;
  }

  .close:hover { color: var(--primary); }

  .big-symbol {
    font-size: 64px;
    font-weight: 800;
    color: var(--primary);
    text-align: center;
    line-height: 1;
    margin-bottom: 6px;
  }

  .name {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 18px;
    color: var(--text-main);
  }

  .row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid var(--border-soft);
    font-size: 14px;
  }

  .row span:first-child { color: var(--text-soft); }

  .cat-tag {
    display: block;
    text-align: center;
    margin-top: 16px;
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 500;
    color: white;
  }

  .cat-alkali .cat-tag { background: var(--cat-alkali); }
  .cat-alkaline-earth .cat-tag { background: var(--cat-alkaline); }
  .cat-transition .cat-tag { background: var(--cat-transition); }
  .cat-post-transition .cat-tag { background: var(--cat-post); }
  .cat-metalloid .cat-tag { background: var(--cat-metalloid); }
  .cat-nonmetal .cat-tag { background: var(--cat-nonmetal); }
  .cat-halogen .cat-tag { background: var(--cat-halogen); }
  .cat-noble .cat-tag { background: var(--cat-noble); }
  .cat-lanthanide .cat-tag { background: var(--cat-lanth); }
  .cat-actinide .cat-tag { background: var(--cat-actin); }

  @media (max-width: 768px) {
    .title h1 { font-size: 32px; }
    #grid { grid-template-columns: repeat(18, minmax(38px, 1fr)); gap: 5px; }
    .cell .sym { font-size: 18px; }
  }
</style>

const grid = document.getElementById('grid');
let activeFilter = null;

function makeCell(e){
  const [num,sym,name,mass,cat,period,group,phase] = e;
  const div = document.createElement('div');
  div.className = 'cell ' + CATS[cat].cls;
  div.dataset.cat = cat;
  div.dataset.name = name.toLowerCase();
  div.dataset.sym = sym.toLowerCase();
  div.dataset.num = num;

  div.style.gridRow = period;
  div.style.gridColumn = group;

  div.innerHTML = `<span class="num">${num}</span><span class="sym">${sym}</span><span class="mass">${mass}</span>`;
  div.onclick = () => openPanel(e);
  grid.appendChild(div);
}

EL.forEach(makeCell);

function placeholder(text, row){
  const div = document.createElement('div');
  div.className = 'placeholder';
  div.style.gridRow = row;
  div.style.gridColumn = 3;
  div.style.gridColumnSpan = 14;
  div.textContent = text;
  grid.appendChild(div);
}
placeholder('57–71', 6);
placeholder('89–103', 7);

const SWATCH_VAR = {
  'alkali-metal':'alkali', 'alkaline-earth-metal':'alkaline-earth', 'transition-metal':'transition',
  'post-transition-metal':'post-transition', 'metalloid':'metalloid', 'reactive-nonmetal':'nonmetal',
  'halogen':'halogen', 'noble-gas':'noble', 'lanthanide':'lanthanide', 'actinide':'actinide'
};
const legend = document.getElementById('legend');
Object.entries(CATS).forEach(([key,val]) => {
  const btn = document.createElement('button');
  btn.innerHTML = `<span class="swatch" style="background:var(--cat-${SWATCH_VAR[key]})"></span>${val.label}`;
  btn.addEventListener('click', () => {
    if(activeFilter === key){
      activeFilter = null;
      btn.classList.remove('active');
    } else {
      document.querySelectorAll('.legend button').forEach(b=>b.classList.remove('active'));
      activeFilter = key;
      btn.classList.add('active');
    }
    applyFilters();
  });
  legend.appendChild(btn);
});

const search = document.getElementById('search');
search.addEventListener('input', applyFilters);

function applyFilters(){
  const q = search.value.trim().toLowerCase();
  document.querySelectorAll('.cell').forEach(cell => {
    const matchesSearch = !q || cell.dataset.name.includes(q) || cell.dataset.sym.includes(q) || cell.dataset.num === q;
    const matchesCat = !activeFilter || cell.dataset.cat === activeFilter;
    cell.classList.toggle('dim', !(matchesSearch && matchesCat));
  });
}

function openPanel(e){
  const [num,sym,name,mass,cat,period,group,phase] = e;
  document.getElementById('p-sym').textContent = sym;
  document.getElementById('p-name').textContent = name;
  document.getElementById('p-num').textContent = num;
  document.getElementById('p-mass').textContent = mass + ' u';
  const pStr = (period===9 ? '6 (Lanthanide)' : period===10 ? '7 (Actinide)' : period);
  const gStr = (period===9 || period===10) ? '—' : group;
  document.getElementById('p-pg').textContent = pStr + ' / ' + gStr;
  document.getElementById('p-phase').textContent = phaseEN[phase];
  const tag = document.getElementById('p-cat');
  tag.textContent = CATS[cat].label;
  tag.className = 'cat-tag ' + CATS[cat].cls;
  document.getElementById('panel-overlay').classList.add('open');
}
function closePanel(){
  document.getElementById('panel-overlay').classList.remove('open');
}
document.getElementById('panel-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'panel-overlay') closePanel();
});
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closePanel(); });
