<!DOCTYPE html>
<html>
<head>
    <title>Nhập tên - ChemLab</title>
    <style>
        body { font-family: Arial; background:#0f172a; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; }
        .box { background:#1e293b; padding:30px; border-radius:12px; text-align:center; width:90%; max-width:400px; }
        input { padding:10px; width:80%; margin:15px 0; border-radius:8px; border:none; font-size:16px; }
        button { padding:10px 25px; background:#3b82f6; color:white; border:none; border-radius:8px; font-size:16px; cursor:pointer; }
        button:hover { background:#2563eb; }
    </style>
</head>
<body>
    <div class="box">
        <h2>👋 Chào mừng đến với ChemLab</h2>
        <p>Vui lòng nhập tên của bạn để bắt đầu:</p>
        <form method="POST">
            <input type="text" name="ten" placeholder="Nhập tên của bạn..." required autocomplete="off">
            <br>
            <button type="submit">Vào trang</button>
        </form>
    </div>
</body>
</html>
